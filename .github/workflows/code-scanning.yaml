name: Code Scanning

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Build for CodeQL with Gradle cache
        run: ./gradlew assemble --no-daemon --parallel
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  format:
    name: Kotlin Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Kotlin formatter
        uses: robinraju/release-downloader@v1
        with:
          repository: facebook/ktfmt
          fileName: ktfmt-*-with-dependencies.jar
      - name: Format Kotlin scripts and source files
        run: |
          java \
            -jar ktfmt-*-with-dependencies.jar \
            $(find . -name "*.kt" -o -name "*.kts")
      - name: Check for formatting violations
        run: git diff --exit-code

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Android Lint
        run: ./gradlew :app:lint --no-daemon --parallel
      - name: Annotate with Android Lint results
        uses: yutailang0119/action-android-lint@v4
        with:
          report-path: app/build/reports/*.xml
          ignore-warnings: false

  reuse:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
