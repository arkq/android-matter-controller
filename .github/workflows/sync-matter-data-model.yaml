name: Sync Matter Data Model

on:
  schedule:
    # Run at 02:00 UTC on the 1st of every month.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-matter-data-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protocol buffer compiler
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler

      - name: Install Python dependencies
        run: pip install lxml protobuf

      - name: Shallow-clone Matter SDK data model directory
        run: |
          git clone \
            --depth 1 \
            --no-checkout \
            --filter=blob:none \
            https://github.com/project-chip/connectedhomeip.git \
            connectedhomeip
          cd connectedhomeip
          git sparse-checkout init --cone
          git sparse-checkout set data_model
          git checkout

      - name: Sync Matter data model assets
        run: |
          scripts/matter-data-model-parser.py \
            --out-proto /tmp/matter_data_model_gen.proto \
            --out-bin-dir app/src/main/assets/matter \
            connectedhomeip/data_model

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-matter-data-model
          commit-message: "chore: Sync Matter data model assets"
          add-paths: app/src/main/assets/matter/v*.bin
