name: Sync Matter Data Model

on:
  schedule:
    # Run at 02:00 UTC on the 1st of every month.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-matter-data-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: project-chip/connectedhomeip
          path: matter-sdk
      - name: Install script dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: python3-lxml
      - name: Download Kotlin formatter
        uses: robinraju/release-downloader@v1
        with:
          repository: facebook/ktfmt
          fileName: ktfmt-*-with-dependencies.jar
          latest: true
      - name: Sync Matter data model
        run: scripts/matter-data-model-parser.py matter-sdk/data_model
      - name: Format generated Kotlin files
        run: |
          java \
            -jar ktfmt-*-with-dependencies.jar \
            app/src/main/java/io/aether/android/matter/*.kt
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-matter-data-model
          commit-message: "chore: Sync Matter data model"
          add-paths: |
            app/src/main/java/io/aether/android/matter/*.kt
