name: Sync Matter Data Model

on:
  schedule:
    # Run at 02:00 UTC on the 1st of every month.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-matter-data-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install lxml protobuf

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler

      - name: Shallow-clone Matter SDK data model directory
        run: |
          git clone \
            --depth 1 \
            --no-checkout \
            --filter=blob:none \
            https://github.com/project-chip/connectedhomeip.git \
            connectedhomeip
          cd connectedhomeip
          git sparse-checkout init --cone
          git sparse-checkout set data_model
          git checkout

      - name: Sync Matter data model assets
        run: |
          scripts/matter-data-model-parser.py \
            --out-proto /tmp/matter_data_model_gen.proto \
            --out-bin-dir app/src/main/assets/matter \
            connectedhomeip/data_model

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: chore/sync-matter-data-model
          commit_message: "chore: Sync Matter data model assets"
          file_pattern: 'app/src/main/assets/matter/v*.bin'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
