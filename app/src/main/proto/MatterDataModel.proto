  TYPE_UNKNOWN = 0;
  TYPE_ACTION_ID = 1;
  TYPE_AMPM = 2;
  TYPE_ATTR_ID = 3;
  TYPE_BITMAP16 = 4;
  TYPE_BITMAP32 = 5;
  TYPE_BITMAP64 = 6;
