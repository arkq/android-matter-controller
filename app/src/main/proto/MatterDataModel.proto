// Android-side "slim" Matter data-model schema.
//
// The binary assets under app/src/main/assets/matter/ are generated by
// scripts/matter-data-model-parser.py, which produces a richer binary that also
// encodes Cluster attributes/commands, Device required_clusters, and StructDefs.
// Because proto3 silently ignores unknown fields, the Android app can parse those
// richer binaries using this simplified definition, extracting only the
// cluster/device id→name mappings it actually needs.  The shared field numbers
// must not be changed without updating the parser script accordingly.

syntax = "proto3";

package matter.data_model;

option java_package = "io.aether.android.matter";
option java_multiple_files = true;

// A Matter cluster entry (id → name).
message Cluster {
  uint32 id = 1;
  string name = 2;
}

// A Matter device-type entry (id → name).
message Device {
  uint32 id = 1;
  string name = 2;
}

// The full data model for one Matter specification version.
message MatterDataModel {
  repeated Device devices = 1;
  repeated Cluster clusters = 2;
}
