enum MatterPrivilege {
  PRIVILEGE_UNKNOWN = 0;
  PRIVILEGE_VIEW = 1;
  PRIVILEGE_OPERATE = 2;
  PRIVILEGE_MANAGE = 3;
  PRIVILEGE_ADMINISTER = 4;
}

message StructField {
  string name = 1;
  MatterType type = 2;
}

message StructDef {
  string name = 1;
  repeated StructField fields = 2;
}

message Attribute {
  uint32 id = 1;
  string name = 2;
  MatterType type = 3;
  MatterPrivilege readPrivilege = 4;
  MatterPrivilege writePrivilege = 5;
}

message Parameter {
  string name = 1;
  MatterType type = 2;
}

message Command {
  uint32 id = 1;
  string name = 2;
  repeated Parameter parameters = 3;
}

// A Matter cluster entry.
message Cluster {
  uint32 id = 1;
  string name = 2;
  repeated Attribute attributes = 3;
  repeated Command commands = 4;
}

// A Matter device-type entry.
message Device {
  uint32 id = 1;
  string name = 2;
  repeated uint32 clusters = 3;
}

// The full data model for one Matter specification version.
message MatterDataModel {
  repeated Device devices = 1;
  repeated Cluster clusters = 2;
  repeated StructDef structs = 3;
}
