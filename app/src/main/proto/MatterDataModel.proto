// Shared Matter data-model schema used by both parser output and Android app.
//
// Binary assets under app/src/main/assets/matter/ are generated by
// scripts/matter-data-model-parser.py and include cluster/device mappings,
// attributes with read/write privileges, command signatures, and struct
// definitions. Keep field numbers in sync with the parser output.

syntax = "proto3";

package matter.data_model;

option java_package = "io.aether.android.matter";
option java_multiple_files = true;

