  TYPE_DATE = 12;
  TYPE_DATETIME = 13;
  TYPE_DAY_OF_WEEK_BITMAP = 14;
  TYPE_DEVTYPE_ID = 15;
  TYPE_DOUBLE = 16;
  TYPE_EPOCH_S = 17;
  TYPE_EPOCH_US = 18;
  TYPE_ENUM16 = 19;
  TYPE_ENUM8 = 20;
  TYPE_EVENT_ID = 21;
  TYPE_FABRIC_IDX = 22;
  TYPE_FABRIC_ID = 23;
  TYPE_FLOAT = 24;
  TYPE_GROUP_ID = 25;
  TYPE_INT16S = 26;
  TYPE_INT16U = 27;
  TYPE_INT24S = 28;
  TYPE_INT24U = 29;
  TYPE_INT32S = 30;
  TYPE_INT32U = 31;
  TYPE_INT40S = 32;
  TYPE_INT40U = 33;
  TYPE_INT48S = 34;
  TYPE_INT48U = 35;
  TYPE_INT56S = 36;
  TYPE_INT56U = 37;
  TYPE_INT64S = 38;
  TYPE_INT64U = 39;
  TYPE_INT8S = 40;
  TYPE_INT8U = 41;
  TYPE_IPV4ADR = 42;
  TYPE_IPV6ADR = 43;
  TYPE_NAMESPACE = 44;
  TYPE_NODE_ID = 45;
  TYPE_NO_DATA = 46;
  TYPE_NULLABLE_ACTION_ID = 47;
  TYPE_NULLABLE_AMPM = 48;
  TYPE_NULLABLE_ATTR_ID = 49;
  TYPE_NULLABLE_BITMAP16 = 50;
  TYPE_NULLABLE_BITMAP32 = 51;
  TYPE_NULLABLE_BITMAP64 = 52;
  TYPE_NULLABLE_BITMAP8 = 53;
  TYPE_NULLABLE_CHAR_STRING = 54;
  TYPE_NULLABLE_CLUSTER_ID = 55;
  TYPE_NULLABLE_CMD_ID = 56;
  TYPE_NULLABLE_DATE = 57;
  TYPE_NULLABLE_DATETIME = 58;
  TYPE_NULLABLE_DAY_OF_WEEK_BITMAP = 59;
  TYPE_NULLABLE_DEVTYPE_ID = 60;
  TYPE_NULLABLE_DOUBLE = 61;
  TYPE_NULLABLE_EPOCH_S = 62;
  TYPE_NULLABLE_EPOCH_US = 63;
  TYPE_NULLABLE_ENUM16 = 64;
  TYPE_NULLABLE_ENUM8 = 65;
  TYPE_NULLABLE_EVENT_ID = 66;
  TYPE_NULLABLE_FABRIC_IDX = 67;
  TYPE_NULLABLE_FABRIC_ID = 68;
  TYPE_NULLABLE_FLOAT = 69;
  TYPE_NULLABLE_GROUP_ID = 70;
  TYPE_NULLABLE_INT16S = 71;
  TYPE_NULLABLE_INT16U = 72;
  TYPE_NULLABLE_INT24S = 73;
  TYPE_NULLABLE_INT24U = 74;
  TYPE_NULLABLE_INT32S = 75;
  TYPE_NULLABLE_INT32U = 76;
  TYPE_NULLABLE_INT40S = 77;
  TYPE_NULLABLE_INT40U = 78;
  TYPE_NULLABLE_INT48S = 79;
  TYPE_NULLABLE_INT48U = 80;
  TYPE_NULLABLE_INT56S = 81;
