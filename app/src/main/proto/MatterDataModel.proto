enum MatterPrivilege {
  PRIVILEGE_UNKNOWN = 0;
  PRIVILEGE_ADMIN = 1;
  PRIVILEGE_MANAGE = 2;
  PRIVILEGE_OPERATE = 3;
  PRIVILEGE_VIEW = 4;
}

message StructField {
  string name = 1;
  MatterType type = 2;
}

message StructDef {
  string name = 1;
  repeated StructField fields = 2;
}

message Attribute {
  uint32 id = 1;
  string name = 2;
  MatterType type = 3;
  MatterPrivilege readPrivilege = 4;
  MatterPrivilege writePrivilege = 5;
}

message Parameter {
  string name = 1;
  MatterType type = 2;
}

message Command {
  uint32 id = 1;
  string name = 2;
  repeated Parameter parameters = 3;
}

message Cluster {
  uint32 id = 1;
  string name = 2;
  repeated Attribute attributes = 3;
  repeated Command commands = 4;
}

message Device {
  uint32 id = 1;
  string name = 2;
  repeated uint32 clusters = 3;
}

message MatterDataModel {
  repeated Device devices = 1;
  repeated Cluster clusters = 2;
  repeated StructDef structs = 3;
}
